name: atlas-loto
services:
  postgres:
    image: postgres:17.6-alpine
    environment: {POSTGRES_DB: atlas_loto, POSTGRES_USER: atlas, POSTGRES_PASSWORD: atlas}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_loto"], interval: 5s, timeout: 3s, retries: 10}
    networks: [internal]
  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
    networks: [internal]
  analytics:
    build: {context: ./services/analytics}
    environment: {ANALYTICS_MAX_BATCH: 5000}
    expose: ["8001"]
    deploy: {resources: {limits: {cpus: "1.0", memory: 1G}}}
    networks: [internal]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, analytics: {condition: service_started}}
    expose: ["3001"]
    ports: ["127.0.0.1:3001:3001"]
    networks: [internal]
  worker:
    build: {context: ., dockerfile: apps/worker/Dockerfile}
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, analytics: {condition: service_started}}
    deploy: {resources: {limits: {cpus: "1.0", memory: 768M}}}
    networks: [internal]
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    environment: {API_URL: http://api:3001, NEXT_PUBLIC_APP_NAME: "${APP_NAME:-Atlas Loto}"}
    depends_on: [api]
    expose: ["8080"]
    ports: ["127.0.0.1:8080:8080"]
    networks: [internal]
  proxy:
    image: caddy:2.10.2-alpine
    profiles: ["standalone-proxy"]
    ports: ["80:80", "443:443"]
    environment: {DOMAIN: "${DOMAIN:-localhost}"}
    volumes: ["./infra/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    depends_on: [web, api]
    networks: [internal]
volumes: {postgres_data: {}, redis_data: {}, caddy_data: {}}
networks: {internal: {}}
